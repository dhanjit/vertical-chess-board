<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="s" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="758" height="298" rx="14" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="380" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2328">Holding &amp; sensing &#8212; cross-section through one square</text>
  <text x="150" y="58" text-anchor="middle" font-size="12" fill="#57606a">&#9664; room side</text>
  <text x="470" y="58" text-anchor="middle" font-size="12" fill="#57606a">behind the board &#9654;</text>

  <!-- piece + hub -->
  <path d="M116 205 Q108 150 116 118 Q140 92 176 98 Q216 104 224 141 Q226 166 214 190 Q198 214 160 214 Q130 214 116 205 Z" fill="#3b3f45"/>
  <rect x="222" y="141" width="42" height="20" rx="4" fill="#3b3f45"/>
  <text x="162" y="246" text-anchor="middle" font-size="12" fill="#1f2328">piece (hub + body)</text>

  <!-- magnet -->
  <ellipse cx="272" cy="151" rx="9" ry="30" fill="#d1495b"/>
  <line x1="272" y1="233" x2="272" y2="184" stroke="#57606a" stroke-width="1" marker-end="url(#s)"/>
  <text x="272" y="246" text-anchor="middle" font-size="12" fill="#d1495b" font-weight="700">magnet</text>

  <!-- felt disc on the magnet face -->
  <rect x="282" y="119" width="6" height="64" rx="2" fill="#9a6700"/>

  <!-- steel sheet (thin, spans the face): two blocks, gap = small sensing hole -->
  <rect x="288" y="66" width="6" height="74" fill="#9aa4ad" stroke="#6b7480"/>
  <rect x="288" y="162" width="6" height="74" fill="#9aa4ad" stroke="#6b7480"/>
  <!-- printed wall behind the sheet: two blocks, gap = sensor bore -->
  <rect x="294" y="66" width="16" height="74" fill="#cbd5db" stroke="#9aa4ad"/>
  <rect x="294" y="162" width="16" height="74" fill="#cbd5db" stroke="#9aa4ad"/>
  <!-- hall sensor in the bore, slid in from the open back, tip flush under the hole -->
  <rect x="294" y="140" width="32" height="22" rx="3" fill="#1a7f37"/>

  <!-- magnetic grip: magnet straight onto the sheet -->
  <g fill="none" stroke="#d1495b" stroke-width="1.4" opacity="0.85">
    <path d="M279 127 Q284 117 288 121"/>
    <path d="M279 175 Q284 185 288 181"/>
  </g>
  <text x="298" y="92" text-anchor="middle" font-size="11" font-weight="700" fill="#d1495b">grips the sheet directly</text>
  <!-- sensing: magnet read through the felt + the hole's air -->
  <line x1="273" y1="151" x2="293" y2="151" stroke="#1a7f37" stroke-width="1.5" stroke-dasharray="2 3"/>

  <!-- right-side labels with leaders -->
  <g stroke="#8c959f" stroke-width="1">
    <line x1="285" y1="121" x2="424" y2="96"/>
    <line x1="291" y1="128" x2="424" y2="130"/>
    <line x1="291" y1="151" x2="424" y2="164"/>
    <line x1="322" y1="162" x2="424" y2="198"/>
    <line x1="306" y1="178" x2="424" y2="232"/>
  </g>
  <g font-size="12" fill="#1f2328">
    <text x="430" y="100">felt disc &#8212; sets the glide</text>
    <text x="430" y="134" font-weight="700">steel sheet (0.5&#8211;1 mm)</text><text x="578" y="134" fill="#57606a"> &#8212; holds the piece</text>
    <text x="430" y="168">small hole = air (no shielding)</text>
    <text x="430" y="202" font-weight="700" fill="#1a7f37">hall sensor</text><text x="516" y="202" fill="#57606a"> &#8212; tip flush under the hole</text>
    <text x="430" y="236">printed wall (~2.5 mm)</text><text x="576" y="236" fill="#57606a"> &#8212; bore from the open back</text>
  </g>
</svg>
