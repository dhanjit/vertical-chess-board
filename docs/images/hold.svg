<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="s" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="758" height="298" rx="14" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="380" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2328">Holding &amp; sensing &#8212; cross-section through one square</text>
  <text x="150" y="58" text-anchor="middle" font-size="12" fill="#57606a">&#9664; room side</text>
  <text x="470" y="58" text-anchor="middle" font-size="12" fill="#57606a">behind the board &#9654;</text>

  <!-- piece + hub -->
  <path d="M116 205 Q108 150 116 118 Q140 92 176 98 Q216 104 224 141 Q226 166 214 190 Q198 214 160 214 Q130 214 116 205 Z" fill="#3b3f45"/>
  <rect x="222" y="141" width="42" height="20" rx="4" fill="#3b3f45"/>
  <text x="162" y="246" text-anchor="middle" font-size="12" fill="#1f2328">piece (hub + body)</text>

  <!-- magnet -->
  <ellipse cx="272" cy="151" rx="9" ry="30" fill="#d1495b"/>
  <line x1="272" y1="233" x2="272" y2="184" stroke="#57606a" stroke-width="1" marker-end="url(#s)"/>
  <text x="272" y="246" text-anchor="middle" font-size="12" fill="#d1495b" font-weight="700">magnet</text>

  <!-- front wall -->
  <rect x="300" y="66" width="12" height="170" fill="#cbd5db" stroke="#9aa4ad"/>
  <!-- steel washer: two blocks, gap = centre hole -->
  <rect x="316" y="66" width="18" height="62" fill="#9aa4ad" stroke="#6b7480"/>
  <rect x="316" y="174" width="18" height="62" fill="#9aa4ad" stroke="#6b7480"/>
  <!-- hall sensor behind the hole -->
  <rect x="340" y="140" width="20" height="22" rx="3" fill="#1a7f37"/>

  <!-- magnetic grip: magnet to steel rings, through the wall -->
  <g fill="none" stroke="#d1495b" stroke-width="1.4" opacity="0.85">
    <path d="M280 132 Q300 118 320 121"/>
    <path d="M280 170 Q300 184 320 181"/>
  </g>
  <text x="300" y="92" text-anchor="middle" font-size="11" font-weight="700" fill="#d1495b">grips through the wall</text>
  <!-- sensing: magnet read through the air hole -->
  <line x1="281" y1="151" x2="340" y2="151" stroke="#1a7f37" stroke-width="1.5" stroke-dasharray="2 3"/>

  <!-- right-side labels with leaders -->
  <g stroke="#8c959f" stroke-width="1">
    <line x1="312" y1="96"  x2="424" y2="98"/>
    <line x1="334" y1="112" x2="424" y2="142"/>
    <line x1="326" y1="151" x2="424" y2="184"/>
    <line x1="360" y1="151" x2="424" y2="226"/>
  </g>
  <g font-size="12" fill="#1f2328">
    <text x="430" y="102">front wall (~2.5 mm)</text>
    <text x="430" y="146" font-weight="700">steel washer</text><text x="524" y="146" fill="#57606a"> &#8212; holds the piece</text>
    <text x="430" y="188">centre hole = air (no shielding)</text>
    <text x="430" y="222" font-weight="700" fill="#1a7f37">hall sensor</text>
    <text x="430" y="238" fill="#57606a">reads the magnet through the hole</text>
  </g>
</svg>
